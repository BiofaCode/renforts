<title>Renforts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout : scène 3D plein écran, HUD en bandeau en haut, panneau de mission ancré en bas (zone du pouce) */
:root {
  --sky: #a9cbe0;
  --ink: #1d2416;
  --paper: #f3ecd9;
  --ally: #2f6fe0;
  --enemy: #d8432f;
  --brass: #f2b632;
  --olive: #55693a;
  --font-display: "Black Ops One", Impact, "Arial Black", system-ui, sans-serif;
  --font-ui: "Chakra Petch", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html { height: 100%; overflow: hidden; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sky); color: var(--ink);
  font-family: var(--font-ui);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; touch-action: none; }
#game canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px;
  pointer-events: none;
}
.chip {
  background: rgba(29, 36, 22, .8); color: var(--paper);
  border-radius: 10px; padding: 6px 10px;
  font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.chip b { color: var(--brass); font-weight: 700; }
.progress {
  flex: 1; min-width: 0; height: 12px; border-radius: 7px; overflow: hidden;
  background: rgba(29, 36, 22, .3); border: 2px solid rgba(29, 36, 22, .7);
}
.progress i { display: block; height: 100%; width: 0; background: var(--brass); }
.icon-btn {
  pointer-events: auto; cursor: pointer;
  border: 0; border-radius: 10px; padding: 6px 10px;
  background: rgba(29, 36, 22, .8); color: var(--paper);
  font: 700 13px var(--font-ui); letter-spacing: .08em; text-transform: uppercase;
  touch-action: manipulation;
}
.icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; will-change: transform;
  font-family: var(--font-display); font-size: 22px; line-height: 1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tag span {
  display: block; color: #fff; padding: 6px 10px 5px; border-radius: 8px;
  border: 2px solid rgba(29, 36, 22, .55);
}
.tag.ally span { background: var(--ally); }
.tag.enemy span { background: var(--enemy); }

.overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.logo {
  font-family: var(--font-display); color: var(--paper);
  font-size: clamp(48px, 15vw, 88px); line-height: .9; letter-spacing: .02em;
  text-shadow: 0 4px 0 var(--ink), 0 0 2px var(--ink);
  -webkit-text-stroke: 2px var(--ink);
  text-align: center;
}
.logo small {
  display: block; margin-top: 10px;
  font: 700 13px var(--font-ui); letter-spacing: .22em; text-transform: uppercase;
  -webkit-text-stroke: 0; text-shadow: none;
  color: var(--ink); background: var(--brass); padding: 4px 10px; border-radius: 4px;
  width: fit-content; margin-left: auto; margin-right: auto;
}
.panel {
  pointer-events: auto; width: 100%; max-width: 420px; box-sizing: border-box;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink);
  padding: 18px; display: flex; flex-direction: column; gap: 12px; text-align: center;
}
.panel h2 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 30px; line-height: 1.05; text-wrap: balance;
}
.eyebrow { font-weight: 700; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--olive); }
.panel p { margin: 0; font-size: 15px; line-height: 1.4; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat {
  border: 2px solid rgba(29, 36, 22, .25); border-radius: 10px; padding: 8px;
  display: flex; flex-direction: column; gap: 2px;
}
.stat span { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--olive); }
.stat strong { font-family: var(--font-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.btn {
  cursor: pointer; touch-action: manipulation;
  border: 3px solid var(--ink); border-radius: 12px; padding: 14px 16px;
  background: var(--brass); color: var(--ink);
  font-family: var(--font-display); font-size: 22px; letter-spacing: .03em;
  box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.secondary {
  background: transparent; font-family: var(--font-ui); font-weight: 700; font-size: 15px;
  padding: 10px 14px; box-shadow: none; border-width: 2px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.btn.secondary:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.hint { font-size: 13px; color: var(--olive); font-weight: 700; }
.upgrades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.upg {
  cursor: pointer; touch-action: manipulation; min-width: 0;
  border: 2px solid var(--ink); border-radius: 10px; background: transparent; color: var(--ink);
  padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-family: var(--font-ui);
}
.upg b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.upg small { font-size: 11px; font-weight: 700; color: var(--olive); white-space: nowrap; }
.upg .cost { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.upg:not([disabled]) .cost { color: var(--ink); background: var(--brass); border-radius: 6px; padding: 0 6px; }
.upg[disabled] { opacity: .45; cursor: not-allowed; }
.upg:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.overlay.center { justify-content: center; background: rgba(29, 36, 22, .4); pointer-events: auto; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); z-index: 6;
  transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  padding: 10px 14px; font-weight: 700; font-size: 15px; line-height: 1.3; text-align: center;
  text-wrap: balance;
  display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
}
.swipe { display: block; width: 150px; height: 6px; border-radius: 3px; background: rgba(29, 36, 22, .2); position: relative; }
.swipe::after {
  content: ""; position: absolute; top: 50%; left: 0; width: 24px; height: 24px; margin-top: -12px;
  border-radius: 50%; background: var(--brass); border: 3px solid var(--ink); box-sizing: border-box;
  animation: swipe 1.1s ease-in-out infinite alternate;
}
@keyframes swipe { from { left: 0; } to { left: calc(100% - 24px); } }
@media (prefers-reduced-motion: reduce) { .swipe::after { animation: none; left: calc(50% - 12px); } }
.tag.bonus span { background: var(--brass); color: var(--ink); }
.panel { max-height: calc(100% - 8px); overflow-y: auto; }
@media (max-height: 640px) { .logo { display: none; } .overlay { justify-content: flex-end; } }
.result-win h2 { color: var(--ally); }
.result-lose h2 { color: var(--enemy); }

.float {
  position: absolute; left: 0; top: 0; pointer-events: none;
  font-family: var(--font-display); font-size: 30px; line-height: 1; white-space: nowrap;
  -webkit-text-stroke: 1.5px var(--ink); text-shadow: 0 3px 0 var(--ink);
  animation: floatUp .9s ease-out forwards;
}
.float.good { color: #9fd0ff; }
.float.bad { color: #ffb3a8; }
@keyframes floatUp {
  from { opacity: 1; translate: 0 0; scale: 1.25; }
  to { opacity: 0; translate: 0 -70px; scale: 1; }
}
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

.prime {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 6;
  transform: translateX(-50%); pointer-events: none; white-space: nowrap;
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
  padding: 8px 16px 10px; text-align: center;
}
.prime span { display: block; font-weight: 700; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--olive); }
.prime strong { font-family: var(--font-display); font-weight: 400; font-size: 34px; font-variant-numeric: tabular-nums; }
.prime em { font-style: normal; font-family: var(--font-display); font-size: 24px; color: var(--ally); margin-left: 8px; }

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
  .float { animation: fadeOut .9s forwards; }
}

/* ---------- Sensations : bannières, combo, flash, médailles qui volent ---------- */
.fx { position: fixed; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
.fx-flash { position: absolute; inset: 0; opacity: 0; background: #fff; }
/* bannière dans le tiers bas (sous l'armée) : ne cache jamais les portes qui arrivent */
.fx-banner {
  position: absolute; left: 50%; top: 75%;
  transform: translate(-50%, -50%) rotate(-3deg);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  max-width: calc(100vw - 32px); text-align: center; white-space: nowrap;
}
.fx-banner strong {
  font-family: var(--font-display); font-weight: 400; line-height: 1; letter-spacing: .02em;
  font-size: clamp(34px, 11.5vw, 60px); color: #fff;
  -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink), 0 0 22px rgba(29, 36, 22, .35);
}
.fx-banner.long strong { font-size: clamp(24px, 7.6vw, 42px); }
.fx-banner.good strong { color: var(--brass); }
.fx-banner.gold strong { color: #ffd166; }
.fx-banner.win strong { color: #9fd0ff; }
.fx-banner.bad strong { color: #ffb3a8; }
.fx-banner small {
  font: 700 13px var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); padding: 3px 10px; border-radius: 6px;
}
.fx-combo {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 56px);
  background: var(--brass); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
  padding: 3px 10px 4px; font: 700 12px var(--font-ui); letter-spacing: .14em; text-transform: uppercase;
  display: flex; align-items: baseline; gap: 6px; transform-origin: left center;
}
.fx-combo b { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.fx-combo.hot { background: #ff8a3d; }
.fx-medal {
  position: absolute; left: 0; top: 0; width: 24px; height: 24px; box-sizing: border-box;
  border-radius: 50%; background: var(--brass); border: 2px solid var(--ink); color: var(--ink);
  font: 700 13px/20px var(--font-ui); text-align: center; box-shadow: 0 2px 0 var(--ink);
}
.tag.ally span { transition: background-color .25s, color .25s, box-shadow .25s, font-size .25s; }
.tag.ally.t1 span { font-size: 26px; }
.tag.ally.t2 span { font-size: 30px; border-color: var(--brass); }
.tag.ally.hot span { background: var(--brass); color: var(--ink); box-shadow: 0 0 0 3px rgba(255, 255, 255, .7), 0 0 24px rgba(242, 182, 50, .95); }
.tag.ally.cold span { background: var(--enemy); }
</style>

<div id="game" aria-label="Jeu Renforts"></div>
<div class="labels" id="labels"></div>

<div class="hud" id="hud" hidden>
  <div class="chip">Op. <b id="hudLevel">1</b></div>
  <div class="progress" aria-hidden="true"><i id="hudProgress"></i></div>
  <div class="chip">★ <b id="hudMedals">0</b></div>
  <button class="icon-btn" id="pauseBtn" type="button" aria-label="Mettre en pause">II</button>
  <button class="icon-btn" id="muteBtn" type="button">Son</button>
</div>

<div class="prime" id="prime" hidden>
  <span>Prime du fort</span>
  <strong>★ <b id="primeVal">0</b></strong><em id="primeMult">×1</em>
</div>

<div class="overlay" id="menu">
  <div class="logo">RENFORTS<small>Grossis ton armée</small></div>
  <div class="panel">
    <div class="eyebrow" id="menuOp">Opération 1</div>
    <h2>Traverse les portes, écrase l'armée rouge</h2>
    <p>Glisse pour choisir tes portes. Ramasse les caisses, évite barricades et mines.</p>
    <button class="btn" id="playBtn" type="button">Lancer l'opération</button>
    <div class="upgrades" role="group" aria-label="Améliorations du camp">
      <button class="upg" id="upRecruit" type="button" title="Plus de soldats au départ"><b>Recrues</b><small id="upRecruitLv">1 soldat</small><span class="cost" id="upRecruitCost">★ 40</span></button>
      <button class="upg" id="upTraining" type="button" title="Tes soldats éliminent plus d'ennemis en combat"><b>Entraînement</b><small id="upTrainingLv">Niv. 0</small><span class="cost" id="upTrainingCost">★ 60</span></button>
      <button class="upg" id="upLoot" type="button" title="Plus de médailles avec la prime du fort"><b>Butin</b><small id="upLootLv">Niv. 0</small><span class="cost" id="upLootCost">★ 50</span></button>
    </div>
    <div class="hint">★ <span id="menuMedals">0</span> médailles</div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div></div>
  <div class="panel" id="endPanel">
    <div class="eyebrow" id="endOp">Opération 1</div>
    <h2 id="endTitle">Mission accomplie</h2>
    <div class="stats">
      <div class="stat"><span id="endStatLabel">Survivants</span><strong id="endSurvivors">0</strong></div>
      <div class="stat"><span>Médailles</span><strong id="endMedals">+0</strong></div>
    </div>
    <button class="btn" id="endBtn" type="button">Opération suivante</button>
    <button class="btn secondary" id="menuBtn" type="button"><span>Retour au camp</span><span>⟵</span></button>
  </div>
</div>

<div class="overlay center" id="pause" hidden>
  <div class="panel">
    <div class="eyebrow" id="pauseOp">Opération 1</div>
    <h2>Pause</h2>
    <button class="btn" id="resumeBtn" type="button">Reprendre</button>
    <button class="btn secondary" id="restartBtn" type="button"><span>Recommencer l'opération</span><span>↻</span></button>
    <button class="btn secondary" id="quitBtn" type="button"><span>Retour au camp</span><span>⟵</span></button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><i class="swipe" id="toastSwipe" hidden></i></div>

<div class="fx" id="fx" aria-hidden="true"><div class="fx-flash" id="fxFlash"></div><div class="fx-combo" id="fxCombo" hidden>Combo<b>×2</b></div><div class="fx-banner" id="fxBanner" hidden><strong></strong><small></small></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Réglages ----------
  const GA = Math.PI * (3 - Math.sqrt(5));
  const HALF = 6;            // demi-largeur de la route
  const UNIT_CLAMP = 5.6;    // un soldat ne sort jamais de la route
  const CX_CLAMP = 4.4;      // centre de l'armée
  const SPEED = 15;
  const SPACING = 0.52;
  const MAX_X = 4.6;         // largeur max de la formation avant qu'elle s'allonge
  const CAP_ALLY = 260, CAP_SQUAD = 140, CAP_FINAL = 240, CAP_ENEMY_TOTAL = 900;
  const COL = {
    ally: 0x2f6fe0, allyLegs: 0x23407a, enemy: 0xd8432f, enemyLegs: 0x6e2219,
    skin: 0xf0c9a0, helmA: 0x4f6233, helmE: 0x2b2b2b, gun: 0x1e1e1e,
    road: 0xb59f74, ground: 0x86a453, sky: 0xa9cbe0, rail: 0x8a7b5c, stone: 0xb9ab8c
  };

  // ---------- Sauvegarde ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('renforts.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('renforts.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let save = { level: 1, medals: 0, recruit: 0, training: 0, loot: 0 };
  let muted = false;

  // ---------- Éléments ----------
  const $ = (id) => document.getElementById(id);
  const container = $('game'), labelsEl = $('labels');

  // ---------- Three.js ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(COL.sky);
  scene.fog = new THREE.Fog(COL.sky, 55, 165);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 400);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x5f7340, 0.8);
  scene.add(hemi);

  const SKY_R = 330;
  const skyGeo = new THREE.SphereGeometry(SKY_R, 24, 12);
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(skyGeo.attributes.position.count * 3), 3));
  const skyDome = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  skyDome.renderOrder = -1;
  scene.add(skyDome);
  function paintSky(top, horizon) {
    const pos = skyGeo.attributes.position, col = skyGeo.attributes.color;
    const a = new THREE.Color(top), b = new THREE.Color(horizon), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const t = Math.pow(Math.max(0, pos.getY(i) / SKY_R), 0.55);
      c.copy(b).lerp(a, t);
      col.setXYZ(i, c.r, c.g, c.b);
    }
    col.needsUpdate = true;
  }
  // Chaîne de montagnes à l'horizon (suit la caméra, estompée par le brouillard)
  const mountainMat = new THREE.MeshLambertMaterial({ color: 0x7c93a6, flatShading: true });
  const mountains = new THREE.Group();
  {
    const r = mulberry32(99);
    for (let i = 0; i < 26; i++) {
      const a = -Math.PI * 0.95 + (i / 25) * Math.PI * 0.9 + (r() - 0.5) * 0.08;
      const dist = 148 + r() * 14, h = 9 + r() * 15, w = 20 + r() * 20;
      const m = new THREE.Mesh(new THREE.ConeGeometry(w, h, 5 + Math.floor(r() * 3)), mountainMat);
      m.position.set(Math.cos(a) * dist, h / 2 - 1.5, Math.sin(a) * dist);
      m.rotation.y = r() * 6;
      mountains.add(m);
    }
  }
  scene.add(mountains);
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.7);
  sun.position.set(-8, 20, 10);
  scene.add(sun);

  function resize() {
    const w = container.clientWidth || window.innerWidth, h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // téléphone en portrait : on recule un peu la caméra
    camera.fov = w / h < 0.8 ? 68 : 55;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // Fusionne plusieurs formes simples en une seule géométrie colorée
  function mergeParts(parts) {
    const pos = [], nor = [], col = [];
    for (const p of parts) {
      const g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
      const c = new THREE.Color(p.color);
      const pa = g.attributes.position.array, na = g.attributes.normal.array;
      for (let i = 0; i < pa.length; i += 3) {
        pos.push(pa[i], pa[i + 1], pa[i + 2]);
        nor.push(na[i], na[i + 1], na[i + 2]);
        col.push(c.r, c.g, c.b);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return g;
  }
  function makeSoldier(body, legs, helm, withLegs) {
    const g = mergeParts([
      { geo: new THREE.BoxGeometry(withLegs === false ? 0.01 : 0.26, withLegs === false ? 0.01 : 0.28, withLegs === false ? 0.01 : 0.16).translate(0, 0.14, 0), color: legs },
      { geo: new THREE.BoxGeometry(0.34, 0.34, 0.22).translate(0, 0.45, 0), color: body },
      { geo: new THREE.BoxGeometry(0.36, 0.06, 0.24).translate(0, 0.31, 0), color: 0x3b2f22 },

      timeScale = f < 0.4 ? 0.12 : 0.12 + 0.88 * (1 - Math.cos(Math.PI * (f - 0.4) / 0.6)) / 2;
      if (!REDUCED) {
        const env = f < 0.08 ? f / 0.08 : f > 0.55 ? Math.max(0, 1 - (f - 0.55) / 0.45) : 1;
        camera.fov = fxFovBase - 10 * env; camera.updateProjectionMatrix();
      }
      if (f >= 1) { fxSlowT = -1; timeScale = 1; camera.fov = fxFovBase; camera.updateProjectionMatrix(); }
    }

    // prime du fort : des médailles jaillissent de la porte du fort vers le compteur de la prime
    if (state === 'victory' && !REDUCED) {
      const v = primeBase + Math.round(primeValue);
      fxStarT -= real;
      if (v > fxPrimeShown && fxStarT <= 0 && fxStars < 24) {
        fxStarT = 0.07; fxPrimeShown = v;
        fxV.set(0, 1.5, -(finalD + 16) + 1.2).project(camera);
        const w = window.innerWidth, h = window.innerHeight, pr = $('primeVal');
        const x0 = Math.abs(fxV.x) < 1.1 ? (fxV.x * 0.5 + 0.5) * w : w / 2, y0 = Math.abs(fxV.y) < 1.1 ? (-fxV.y * 0.5 + 0.5) * h : h * 0.45;
        const [x1, y1] = rectCenter(pr);
        fxStar(x0 + (Math.random() - 0.5) * 40, y0, x1, y1, 0, () => {
          try { pr.parentElement.animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 160 }); } catch (e) {}
        });
      }
    }

    // son : foule et pas de l'armée proportionnels à sa taille, tension près du fort
    const lg = Math.log2(Math.max(1, c) + 1);
    sfxTramp = running ? Math.min(0.2, 0.022 * lg) : 0;
    fxCrowdT -= real;
    if (fxCrowdT <= 0) { fxCrowdT = 0.25; crowdSet(running ? Math.min(0.045, 0.0045 * lg) : 0, c); }
    let ten = 0;
    if (running) {
      if ((battle && battle.final) || (bossMesh && finalD - ally.d < 90)) ten = 2;
      else if (finalD - ally.d < 100) ten = 1;
    }
    musicTension = ten;
  }

  function step(dt) {
    time += dt;
    const running = state === 'run' || state === 'battle';

    // Direction au clavier (flèches, Q/D, A/D)
    if (running) {
      const dir = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['q'] || keys['a'] ? 1 : 0);
      if (dir) ally.cx = Math.max(-CX_CLAMP, Math.min(CX_CLAMP, ally.cx + dir * 9 * dt));
    }

    if (state === 'run') {
      ally.d += SPEED * dt;

      // Portes
      for (const g of gates) {
        if (!g.passed && ally.d >= g.d) {
          g.passed = true;
          g.chosen = ally.cx < g.off ? 0 : 1;
          const o = g.opts[g.chosen];
          const before = ally.count;
          ally.count = applyOp(ally.count, o);
          if (ally.count < before) syncUnits(ally, CAP_ALLY, ally.cx, true);
          fxGate(o, g.opts[1 - g.chosen], before);
          sfx(ally.count >= before ? 'good' : 'bad');
          floatText(opLabel(o), ally.count >= before);
          if (ally.count < before) addShake(0.15);
          if (allyTag) bump(allyTag);
          if (ally.count <= 0) { lose(); return; }
        }
      }

      // Indices du tutoriel, la première fois qu'un élément arrive
      const ahead = (dd) => dd - ally.d > 0 && dd - ally.d < 38;
      if (crates.some((c) => !c.taken && ahead(c.d))) hintOnce('crate', 'Passe sur la caisse : des renforts tombent du ciel !');
      else if (mines.some((m) => !m.done && ahead(-m.z))) hintOnce('mines', 'Champ de mines : évite les lumières rouges');
      else if (obstacles.some((o) => ahead(o.d))) hintOnce('barricade', 'Barricade : contourne-la ou tu perds des soldats');
      else if (bossMesh && finalD - ally.d < 75) hintOnce('boss2', 'Le Général bombarde ! Esquive les cercles rouges');
      else if (nests.some((x) => ahead(x.d))) hintOnce('nest', 'Mitrailleuse ! Passe loin d\'elle pour perdre moins de soldats');
      else if (tankPickup && !tankPickup.taken && ahead(tankPickup.d)) hintOnce('tank', 'Un blindé ! Passe dessus pour qu\'il rejoigne ton armée');
      else if (gates.some((g) => g.move && !g.passed && ahead(g.d))) hintOnce('movegate', 'Ces portes bougent : vise au bon moment');
      else { const sq = nextSquad(); if (sq && !sq.final && ahead(sq.d)) hintOnce('squad', 'Escouade ennemie : chaque soldat en élimine un'); }

      // Caisses de renfort
      for (const c of crates) {
        if (c.taken || ally.d < c.d) continue;
        c.taken = true;
        if (Math.abs(ally.cx - c.x) < 2.4) {
          ally.count += c.v;
          ally.dropY = true;
          syncUnits(ally, CAP_ALLY, ally.cx, false);
          ally.dropY = false;
          c.group.visible = false; c.tag.hidden = true;
          for (let j = 0; j < 14; j++) addPart({ x: c.x, y: 0.8, z: -c.d, vx: (Math.random() - 0.5) * 6, vy: 3 + Math.random() * 4, vz: (Math.random() - 0.5) * 6, life: 0.8, max: 0.8, g: 12, size: 1.2, color: j % 2 ? 0x9a6b3c : 0xf2b632 });
          floatText('+' + c.v, true);
          sfx('good');
          if (allyTag) bump(allyTag);
        }
      }

      // Blindé à récupérer
      if (tankPickup && !tankPickup.taken && ally.d >= tankPickup.d) {
        tankPickup.taken = true;
        tankPickup.tag.hidden = true;
        if (Math.abs(ally.cx - tankPickup.x) < 2.8) {
          const hp = 30 + save.level * 3;
          ally.tank = { hp, max: hp, group: tankPickup.group, turret: tankPickup.turret, fireT: 0.6 };
          tankPickup.group.rotation.y = 0;
          floatText('Blindé !', true);
          sfx('good');
          if (allyTag) bump(allyTag);
        }
      }

      // Combat
      const s = nextSquad();
      if (s) {
        const rA = radiusOf(ally.units.length), rE = radiusOf(s.units.length);
        if ((s.d - rE) - (ally.d + rA) < 0.6) { battle = s; battleAcc = 0; battleAccE = 0; state = 'battle'; }
      }
    }

    if (state === 'battle' && battle) {
      const s = battle;
      const rate = Math.min(280, Math.max(14, (ally.count + s.count) * 1.1));
      battleAcc += rate * dt;            // pertes alliées
      battleAccE += rate * power() * dt; // pertes ennemies (Entraînement)
      let ka = Math.floor(battleAcc), ke = Math.floor(battleAccE);
      battleAcc -= ka; battleAccE -= ke;
      ke = Math.min(ke, s.count);
      ka = Math.min(ka, ally.count);
      // le blindé encaisse la moitié des pertes
      if (ally.tank && ka > 1) { const ab = Math.min(Math.floor(ka / 2), ally.tank.hp); ally.tank.hp -= ab; ka -= ab; }
      if (s.count - ke <= 0) ka = Math.min(ka, Math.ceil(ke / power())); // les derniers ennemis ne valent pas plus qu'eux-mêmes
      const k = Math.max(ka, ke);
      if (k > 0) {
        ally.count -= ka; s.count -= ke;
        syncUnits(ally, CAP_ALLY, ally.cx, 'kill');
        syncUnits(s, s.cap, s.x, 'kill');
        sfx('hit');
        addShake(Math.min(0.1, 0.02 + k * 0.004));
      }
      // les deux armées se rapprochent
      const gap = s.d - ally.d;
      if (gap > 0.5) { ally.d += Math.min(gap - 0.5, 4 * dt); s.d -= Math.min(gap - 0.5, 2.5 * dt); }
      s.x += (ally.cx - s.x) * Math.min(1, dt * 1.5);
      if (ally.count <= 0) { lose(); return; }
      if (s.count <= 0) {
        s.alive = false; s.tag.hidden = true;
        battle = null;
        if (!s.final) fxSquad();
        if (s.final) win(); else state = 'run';
      }
    }

    if (running) {
      // Fusillade : les deux armées échangent des tirs à l'approche et pendant le combat
      const sq = nextSquad();
      if (sq && ally.units.length && sq.units.length && (state === 'battle' || sq.d - ally.d < 20)) {
        ambAcc += Math.min(28, (ally.units.length + sq.units.length) * 0.25) * dt;
        while (ambAcc >= 1) {
          ambAcc -= 1;
          const fromAlly = Math.random() < 0.5;
          const A = fromAlly ? ally : sq, Bg = fromAlly ? sq : ally;
          const [ax, az] = unitPos(A, A.units[Math.floor(Math.random() * A.units.length)]);
          const [bx, bz] = unitPos(Bg, Bg.units[Math.floor(Math.random() * Bg.units.length)]);
          addTracer(ax, 0.62, az, bx + (Math.random() - 0.5), 0.5, bz);
          sfx('shot');
        }
      }

      // Blindé : suit l'armée, tire des obus, s'écroule s'il n'a plus de blindage
      if (ally.tank) {
        const T = ally.tank;
        if (sq && (state === 'battle' || sq.d - ally.d < 26) && sq.count > 0) {
          T.fireT -= dt;
          if (T.fireT <= 0) {
            T.fireT = 0.9;
            const k = Math.min(sq.count, 3 + Math.floor(save.level / 2));
            sq.count -= k;
            addTracer(ally.cx, 1.2, tankZ() - 1.5, sq.x, 0.6, -sq.d, true);
            syncUnits(sq, sq.cap, sq.x, 'kill');
            fireball(sq.x, -sq.d + 1, 0.7);
            sfx('cannon');
            addShake(0.12);
            if (sq.count <= 0 && !sq.final) fxSquad();
            if (sq.count <= 0 && state === 'battle') { sq.alive = false; sq.tag.hidden = true; battle = null; if (sq.final) { win(); } else state = 'run'; }
            else if (sq.count <= 0) { sq.alive = false; sq.tag.hidden = true; if (sq.final) win(); }
          }
        }
        if (T.hp <= 0) {
          fireball(ally.cx, tankZ(), 1.4); sfx('boom'); addShake(0.35);
          T.group.visible = false; ally.tank = null; tankTag.hidden = true;
          floatText('Blindé détruit', false);
        }
      }

      // Mitrailleuses au bord de la route : plus tu passes loin, moins elles touchent
      for (const ns of nests) {
        const ahd = ns.d - ally.d;
        if (ahd > 36 || ahd < -3 || !ally.units.length) continue;
        ns.fireT -= dt;
        ns.gun.lookAt(ally.cx, 0.8, -ally.d);
        while (ns.fireT <= 0 && ally.units.length) {
          ns.fireT += ns.interval;
          const i = Math.floor(Math.random() * ally.units.length);
          const [tx, tz] = unitPos(ally, ally.units[i]);
          addTracer(ns.x, 1.05, -ns.d, tx, 0.6, tz);
          sfx('shot');
          const pHit = Math.max(0.2, Math.min(1, 1.25 - Math.abs(ally.cx - ns.x) / 8));
          if (ally.tank && Math.random() < 0.3) { ally.tank.hp -= 1; continue; }
          if (Math.random() < pHit) {
            const weight = ally.count / ally.units.length;
            ally.units.splice(i, 1);
            spawnCorpse(0, tx, tz);
            ally.count = Math.max(0, ally.count - Math.max(1, Math.round(weight)));
          }
        }
        if (ally.count <= 0) { lose(); return; }
      }

      // Le Général bombarde : un cercle rouge annonce où tombe l'obus
      const fsq = squads[squads.length - 1];
      if (bossMesh && fsq && fsq.alive && finalD - ally.d < 70) {
        bossFireT -= dt;
        if (bossFireT <= 0) {
          bossFireT = Math.max(1.0, 2.1 - save.level * 0.04);
          const dur = 1.15;
          const tx = clampX(ally.cx + (Math.random() - 0.5) * 2.5);
          const tz = -(ally.d + (state === 'battle' ? 0 : SPEED * dur * 0.8)) - (Math.random() - 0.3) * 2;
          const mesh = new THREE.Mesh(shellGeo, shellMat);
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.position.set(tx, 0.05, tz);
          levelGroup.add(mesh); levelGroup.add(ring);
          shells.push({ x0: clampX(fsq.x), y0: 6, z0: -fsq.d - 1, x1: tx, z1: tz, t: 0, dur, mesh, ring });
          sfx('cannon');
        }
      }
    }
    for (let i = shells.length - 1; i >= 0; i--) {
      const sh = shells[i];
      sh.t += dt;
      const f = Math.min(1, sh.t / sh.dur);
      sh.mesh.position.set(sh.x0 + (sh.x1 - sh.x0) * f, sh.y0 * (1 - f) + 9 * 4 * f * (1 - f), sh.z0 + (sh.z1 - sh.z0) * f);
      sh.ring.scale.setScalar(1 + 0.15 * Math.sin(time * 20));
      if (f >= 1) {
        levelGroup.remove(sh.mesh); levelGroup.remove(sh.ring);
        shells.splice(i, 1);
        explodeAt(sh.x1, sh.z1, 2.0, 1.2);
        if (running && ally.count <= 0) { lose(); return; }
      }
    }

    // Barricades : chaque soldat qui la touche tombe (le blindé, lui, les écrase)
    if (running) {
      for (const ob of obstacles) {
        if (ob.dead) continue;
        ob.cx = ob.move ? Math.sin(time * 1.3 + ob.phase) * (HALF - ob.w / 2) : ob.c0;
        ob.group.position.x = ob.cx;
        const oz = -ob.d;
        if (Math.abs(oz + ally.d) > 14) continue;
        if (ally.tank && Math.abs(tankZ() - oz) < 1.6 && Math.abs(ally.cx - ob.cx) < ob.w / 2 + 1.2) {
          ob.dead = true; ob.group.visible = false;
          fireball(ob.cx, oz, 0.8); sfx('boom'); addShake(0.2);
          floatText('Écrasée !', true);
          continue;
        }
        const xa = ob.cx - ob.w / 2 - 0.15, xb = ob.cx + ob.w / 2 + 0.15;
        const n = ally.units.length;
        if (!n) continue;
        const weight = ally.count / n;
        let killed = 0;
        for (let i = n - 1; i >= 0; i--) {
          const u = ally.units[i];
          const wx = clampX(ally.cx + u.x), wz = -ally.d + u.z;
          if (Math.abs(wz - oz) < 0.35 && wx > xa && wx < xb) {
            ally.units.splice(i, 1);
            burst(wx, wz, COL.ally, 2);
            spawnCorpse(0, wx, wz);
            killed++;
          }
        }
        if (killed) {
          ally.count = Math.max(0, ally.count - Math.max(killed, Math.round(killed * weight)));
          syncUnits(ally, CAP_ALLY, ally.cx, true);
          sfx('hit');
          addShake(0.12);
          if (ally.count <= 0) { lose(); return; }
        }
      }
      // Mines : explosent au contact et font tomber les soldats autour
      for (const m of mines) {
        if (m.done || Math.abs(m.z + ally.d) > 14 || !ally.units.length) continue;
        let hit = false;
        for (const u of ally.units) {
          const wx = clampX(ally.cx + u.x), wz = -ally.d + u.z;
          if (Math.abs(wx - m.x) < 0.55 && Math.abs(wz - m.z) < 0.55) { hit = true; break; }
        }
        if (!hit) continue;
        m.done = true; m.group.visible = false;
        explodeAt(m.x, m.z, 1.7);
        if (ally.count <= 0) { lose(); return; }
      }
    } else {
      for (const ob of obstacles) if (ob.move) { ob.cx = Math.sin(time * 1.3 + ob.phase) * (HALF - ob.w / 2); ob.group.position.x = ob.cx; }
    }

    if (state === 'victory') {
      stateTimer += dt;
      if (fortressFlag) fortressFlag.material.color.lerp(tmpColor.set(COL.ally), Math.min(1, dt * 3));
      ally.cx += (0 - ally.cx) * Math.min(1, dt * 3);
      if (stateTimer > 0.5) {
        // les soldats entrent dans le fort : chacun rapporte des médailles, le multiplicateur monte
        ally.d += SPEED * 0.55 * dt;
        const doorZ = -(finalD + 16) + 1.2;
        const n = ally.units.length;
        if (n) {
          const weight = ally.count / n;
          let inside = 0;
          for (let i = n - 1; i >= 0; i--) {
            if (-ally.d + ally.units[i].z < doorZ) { ally.units.splice(i, 1); inside++; }
          }
          if (inside) {
            const got = Math.min(ally.count, Math.max(inside, Math.round(inside * weight)));
            ally.count -= got;
            for (let j = 0; j < got; j++) { primeSoldiers++; primeValue += 0.25 * primeMult() * (1 + 0.2 * (save.loot || 0)); }
            updatePrime();
            sfx('coin');
          }
        }
        if (ally.count <= 0 || stateTimer > 10) {
          ally.count = 0; ally.units.length = 0;
          lastEarned = primeBase + Math.round(primeValue);
          save.medals += lastEarned;
          persist();
          state = 'done';
          setTimeout(() => showEnd(true, primeSoldiers, lastEarned), 500);
        }
      }
    }
    if (state === 'defeat') {
      stateTimer += dt;
      if (stateTimer > 1.0) { state = 'done'; showEnd(false, lastEnemyLeft, 0); }
    }

    for (const m of mines) if (!m.done) m.led.visible = Math.sin(time * 9 + m.phase) > 0;

    for (const g of gates) if (g.move && !g.passed) { g.off = Math.sin(time * 1.4 + g.phase) * 2.2; for (const h of g.halves) h.group.position.x = g.off; }

    // Animation des portes franchies
    for (const g of gates) {
      if (!g.passed || g.fade >= 1) continue;
      g.fade = Math.min(1, g.fade + dt * 2.2);
      g.halves.forEach((h, idx) => {
        if (idx === g.chosen) { h.mat.opacity = 1 - g.fade; h.panel.scale.setScalar(1 + g.fade * 0.4); }
        else { h.mat.opacity = 1 - g.fade; }
        h.group.position.y = -g.fade * 4;
        if (g.fade >= 1) h.group.visible = false;
      });
    }

    if (state !== 'victory' && state !== 'done') syncUnits(ally, CAP_ALLY, ally.cx, false);
    else if (state === 'victory' && ally.count > ally.units.length) {
      // renforts qui arrivent par l'arrière pendant l'entrée au fort
      while (ally.units.length < Math.min(ally.count, CAP_ALLY)) ally.units.push({ x: (Math.random() - 0.5) * 2, z: 4 + Math.random() * 3 });
    }
    formUpdate(ally, dt, state === 'victory' ? 1.6 : 0);
    for (const s of squads) if (s.alive) formUpdate(s, dt);
  }

  let lastEarned = 0, lastEnemyLeft = 0;
  let primeBase = 0, primeSoldiers = 0, primeValue = 0;
  function primeMult() { return Math.min(4, 1 + Math.floor(primeSoldiers / 50) * 0.5); }
  function updatePrime() {
    $('primeVal').textContent = primeBase + Math.round(primeValue);
    $('primeMult').textContent = '×' + String(primeMult()).replace('.', ',');
  }
  function win() {
    state = 'victory'; stateTimer = 0;
    primeBase = 10 + save.level * 2;
    primeSoldiers = 0; primeValue = 0;
    save.level += 1;
    persist();
    timeScale = 0.3; slowTimer = 0.9;
    confetti(0, -(finalD + 8), 160);
    addShake(0.4);
    stopMusic();
    sfx('win');
    updatePrime();
    $('prime').hidden = false;
    fxWin();
  }
  function lose() {
    state = 'defeat'; stateTimer = 0;
    const s = battle || nextSquad();
    lastEnemyLeft = s ? s.count : 0;
    battle = null;
    stopMusic();
    addShake(0.3);
    sfx('lose');
    fxLose();
  }

  function render() {
    // Soldats alliés : corps, deux jambes qui alternent, ombre
    const bobT = time * 12;
    const n = ally.units.length;
    const moving = state === 'run' || state === 'battle' || state === 'victory';
    let sh = 0;
    for (let i = 0; i < n; i++) {
      const u = ally.units[i];
      const ph = bobT + i * 1.7;
      const y = (moving ? Math.abs(Math.sin(ph)) * 0.1 : 0) + (u.y || 0);
      const sw = moving ? Math.sin(ph) * 0.75 : 0;
      const x = clampX(ally.cx + u.x), z = -ally.d + u.z;
      mtx.makeTranslation(x, y, z);
      allyMesh.setMatrixAt(i, mtx);
      mtx.makeRotationX(sw).setPosition(x - LEG_X, HIP_Y + y, z);
      allyLegs.setMatrixAt(i * 2, mtx);
      mtx.makeRotationX(-sw).setPosition(x + LEG_X, HIP_Y + y, z);
      allyLegs.setMatrixAt(i * 2 + 1, mtx);
      const ss = u.y ? Math.max(0.3, 1 - u.y * 0.15) : 1;
      mtx.makeScale(ss, 1, ss).setPosition(x, 0.02, z);
      shadowMesh.setMatrixAt(sh++, mtx);
    }
    allyMesh.count = n;
    allyLegs.count = n * 2;
    allyMesh.instanceMatrix.needsUpdate = true;
    allyLegs.instanceMatrix.needsUpdate = true;

    // Soldats ennemis (seulement les escouades proches)
    let e = 0;
    for (const s of squads) {
      if (!s.alive || s.d - ally.d > 150 || s.d - ally.d < -20) { s.tag.hidden = true; continue; }
      const fighting = battle === s;
      for (let i = 0; i < s.units.length && e < CAP_ENEMY_TOTAL; i++) {
        const u = s.units[i];
        const ph = bobT * 0.8 + i;
        const y = fighting ? Math.abs(Math.sin(ph)) * 0.1 : 0;
        const sw = fighting ? Math.sin(ph) * 0.6 : 0;
        const x = clampX(s.x + u.x), z = -s.d + u.z;
        mtx.copy(rotPi).setPosition(x, y, z);
        enemyMesh.setMatrixAt(e, mtx);
        mtx.copy(rotPi).multiply(legRot.makeRotationX(sw)).setPosition(x + LEG_X, HIP_Y + y, z);
        enemyLegs.setMatrixAt(e * 2, mtx);
        mtx.copy(rotPi).multiply(legRot.makeRotationX(-sw)).setPosition(x - LEG_X, HIP_Y + y, z);
        enemyLegs.setMatrixAt(e * 2 + 1, mtx);
        mtx.makeTranslation(x, 0.02, z);
        shadowMesh.setMatrixAt(sh++, mtx);
        e++;
      }
      const boss = s.final && bossMesh;
      setTag(s.tag, boss ? 'Général · ' + s.count : s.count);
      placeTag(s.tag, s.x, boss ? 6.6 : 2.4, -s.d);
    }
    enemyMesh.count = e;

    if (bossMesh) {
      const fs = squads[squads.length - 1];
      if (fs.alive) bossMesh.position.set(clampX(fs.x), Math.abs(Math.sin(time * 3)) * 0.15, -fs.d - 1.5);
      else if (bossFall < 1) { bossFall = Math.min(1, bossFall + lastDt * 1.6); bossMesh.rotation.x = -bossFall * Math.PI / 2; bossMesh.position.y = 0; }
      if (!fs.alive && ally.d > fs.d + 2) bossMesh.visible = false;
    }
    // Blindé
    if (ally.tank) {
      const T = ally.tank, tz = tankZ();
      T.group.position.set(ally.cx, Math.abs(Math.sin(time * 14)) * 0.04, tz);
      setTag(tankTag, 'Blindé · ' + Math.max(0, T.hp));
      placeTag(tankTag, ally.cx, 2.6, tz);
    } else if (tankTag) tankTag.hidden = true;
    if (tankPickup && !tankPickup.taken) {
      if (tankPickup.d - ally.d < 120) { setTag(tankPickup.tag, 'Blindé'); placeTag(tankPickup.tag, tankPickup.x, 2.8, -tankPickup.d); }
      else tankPickup.tag.hidden = true;
    }

    // Soldats tombés
    const cms = [allyCorpses, enemyCorpses];
    const rearZ = -ally.d + radiusOf(ally.units.length) + 1; // une fois l'armée passée, les corps disparaissent
    for (let team = 0; team < 2; team++) {
      const list = corpses[team];
      let c = 0;
      for (let i = list.length - 1; i >= 0; i--) {
        const cp = list[i];
        cp.t += lastDt;
        if (cp.t > 3.2 || cp.z > rearZ) { list.splice(i, 1); continue; }
        if (cp.vy || cp.y > 0) { cp.y = Math.max(0, cp.y + cp.vy * lastDt); cp.vy -= 18 * lastDt; if (cp.y === 0) cp.vy = 0; }
        const a = Math.min(1, cp.t * 5) * Math.PI * 0.47;
        const sink = cp.t > 2.3 ? (cp.t - 2.3) * 0.7 : 0;
        mtx.makeRotationY(cp.yaw).multiply(legRot.makeRotationX(a)).setPosition(cp.x, cp.y + 0.08 - sink, cp.z);
        cms[team].setMatrixAt(c++, mtx);
      }
      cms[team].count = c;
      cms[team].instanceMatrix.needsUpdate = true;
    }

    // Balles traçantes
    let tc = 0;
    for (let i = tracers.length - 1; i >= 0; i--) {
      const tr = tracers[i];
      tr.t += lastDt;
      if (tr.t >= tr.dur) { tracers.splice(i, 1); continue; }
      const f = tr.t / tr.dur;
      trDummy.position.set(tr.x0 + (tr.x1 - tr.x0) * f, tr.y0 + (tr.y1 - tr.y0) * f, tr.z0 + (tr.z1 - tr.z0) * f);
      trDummy.lookAt(tr.x1, tr.y1, tr.z1);
      trDummy.scale.set(tr.big ? 3 : 1, tr.big ? 3 : 1, tr.big ? 1.6 : 1.3);
      trDummy.updateMatrix();
      tracerMesh.setMatrixAt(tc++, trDummy.matrix);
    }
    tracerMesh.count = tc;
    tracerMesh.instanceMatrix.needsUpdate = true;

    for (const c of crates) {
      if (c.taken || c.d - ally.d > 120) { c.tag.hidden = true; continue; }
      c.group.rotation.y = time * 1.2;
      setTag(c.tag, '+' + c.v);
      placeTag(c.tag, c.x, 2.3, -c.d);
    }
    enemyMesh.instanceMatrix.needsUpdate = true;
    enemyLegs.count = e * 2;
    enemyLegs.instanceMatrix.needsUpdate = true;
    shadowMesh.count = sh;
    shadowMesh.instanceMatrix.needsUpdate = true;

    // Particules
    const dt = lastDt;
    let pc = 0;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy -= p.g * dt;
      p.x += p.vx * dt; p.y = Math.max(0.07, p.y + p.vy * dt); p.z += p.vz * dt;
      const s = Math.max(0.01, p.life / p.max) * p.size;
      mtx.makeScale(s, s, s).setPosition(p.x, p.y, p.z);
      partMesh.setMatrixAt(pc, mtx);
      partMesh.setColorAt(pc, tmpColor.set(p.color));
      pc++;
    }
    partCursor = Math.min(partCursor, Math.max(0, parts.length - 1));
    partMesh.count = pc;
    partMesh.instanceMatrix.needsUpdate = true;
    if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;

    // Caméra
    const ending = state === 'victory' || state === 'done';
    const cd = ending ? Math.min(ally.d, finalD + 2) : ally.d;
    const r = ending ? 4 : Math.min(radiusOf(n), 7);
    const zoom = state === 'battle' ? 0.8 : 1;
    camTarget.set(ally.cx * 0.45, (8 + r * 0.6) * zoom, -cd + (11 + r * 0.8) * zoom);
    const k = 1 - Math.exp(-4 * lastRealDt);
    camBase.lerp(camTarget, k);
    camLook.lerp(v3.set(ally.cx * 0.3, 0.5, -cd - 10), k);
    camera.position.copy(camBase);
    if (shake > 0.002) {
      camera.position.x += (Math.random() - 0.5) * shake;
      camera.position.y += (Math.random() - 0.5) * shake;
      shake *= Math.exp(-7 * lastRealDt);
    }
    camera.lookAt(camLook);
    skyDome.position.copy(camera.position);
    mountains.position.set(camera.position.x, 0, camera.position.z);

    // Étiquettes
    if (allyTag) {
      setTag(allyTag, ally.count);
      if (ending) { allyTag.hidden = true; if (tankTag) tankTag.hidden = true; }
      else placeTag(allyTag, ally.cx, 2.1, -ally.d);
    }
    $('hudProgress').style.width = Math.min(100, (ally.d / finalD) * 100).toFixed(1) + '%';

    renderer.render(scene, camera);
  }

  let lastDt = 0.016, lastRealDt = 0.016;
  function frame(now) {
    const real = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (slowTimer > 0) { slowTimer -= real; if (slowTimer <= 0) timeScale = 1; }
    const dt = real * timeScale;
    lastDt = dt; lastRealDt = real;
    musicTick();
    fxTick(real);
    if (toastTimer > 0 && !paused) { toastTimer -= real; if (toastTimer <= 0) $('toast').hidden = true; }
    if (state !== 'menu' && !paused) step(dt);
    else { time += dt; syncUnits(ally, CAP_ALLY, 0, false); formUpdate(ally, dt); }
    render();
    requestAnimationFrame(frame);
  }

  window.__renforts = { get state() { return state; }, get count() { return ally.count; }, get d() { return ally.d; }, get finalD() { return finalD; }, steer(x) { ally.cx = x; }, nextGate() { const g = gates.find((g) => !g.passed); return g ? { d: g.d, opts: g.opts } : null; } };

  function start(data) {
    const saved = store.get('save', null);
    if (saved && typeof saved.level === 'number') save = Object.assign(save, saved);
    if (data && data.save) save = Object.assign(save, data.save);
    muted = !!store.get('muted', false);
    window.claude?.hot?.snapshot?.(() => ({ save }));
    resize();
    const go = () => { buildLevel(); camBase.set(0, 9, 12); requestAnimationFrame((t) => { last = t; frame(t); }); };
    // on attend la police des portes (au plus 1,5 s)
    let started = false;
    const once = () => { if (!started) { started = true; go(); } };
    try { Promise.race([document.fonts.load('150px "Black Ops One"'), new Promise((r) => setTimeout(r, 1500))]).then(once, once); }
    catch (e) { once(); }
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
